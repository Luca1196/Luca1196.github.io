<!--
=====================================================================
INSTRUCTIVO PARA SEGUIR TRABAJANDO (leer esto en vez de analizar todo el codigo)
=====================================================================
QUE ES: app de estudio de Luca (UdelaR) que junta Prog4 (diagramas de comunicacion) y Logica (deduccion natural).
Pestana Repaso = tarjetas con repaso espaciado (tipo Anki) y preguntas de opcion multiple (tipo Duolingo) para asegurar las BASES.
Pestanas Ejercicios Prog4 / Ejercicios Logica = las apps de ejercicios completos, cargadas en un iframe desde archivos publicados junto a esta pagina.
PREFERENCIAS DE LUCA: todo en espanol; gastar pocos tokens; nada de vistas previas ni redisenos; minima friccion para empezar a estudiar.

ARCHIVOS DEL ARTEFACTO (se publican con Artifact, url + file_path + files):
  index.html   esta pagina (repaso). Para cambiarla: publicar con url + edits (pares old_str/new_str).
  prog4.html   app de ejercicios de comunicacion (tiene su propio instructivo en el <head>).
  logica.html  app de ejercicios de deduccion natural (tiene su propio instructivo).
  Para actualizar una de las dos apps: leerla con Artifact read + url + path "prog4.html" (o "logica.html"), editarla localmente y republicar con
  files:{"prog4.html":"<ruta local>"}. Los archivos que no se pasan se conservan. Si la app embebida cambia de ejercicios, no hace falta tocar index.html.
  Los artefactos originales sueltos (Prog4 y Logica) siguen existiendo; ya no son la copia de trabajo.

CODIGO DE ESTA PAGINA (un solo script):
  CARDS = P4A + LGA, todas escritas a mano. Tarjetas CORTAS: una idea y una decision rapida (pedido de Luca: nada de parrafos).
  Formato:  mc(subj, tag, enunciado, correcta, [distractores x1-3], explicacion_de_una_linea)   subj = "p4" | "lg"; las opciones se mezclan al mostrar.
  El enunciado puede tener varias lineas: las primeras son el ESCENARIO (caja monoespaciada) y la ULTIMA es la pregunta.
  Estilo: "que etiqueta va", "como desarmo esto", "uso find o un metodo", "que cancela esta regla". Opciones de pocas palabras. La teoria larga vive en las
  pestanas de ejercicios (Reglas / Mis errores), no en las tarjetas. fc(subj, tag, frente, html_dorso) sigue soportado pero no se usa.
  ID de tarjeta = hash(subj + tipo + enunciado). Si cambias el enunciado se considera una tarjeta nueva (pierde su historial).
  META DIARIA: nm nuevas por dia (chips 10/20/40). Lo no hecho se ACUMULA en debt: al cambiar de dia, debt = max(0, nm + debt - nw) + dias sin entrar * nm.
  Meta de hoy = min(nm + debt, nuevas que quedan). NO es un tope: "Empezar con la meta" = vencidas + cuota de nuevas; "Estudiar todo el mazo" = vencidas + TODAS las nuevas
  (sin limite, para estudiar muchas horas seguidas); "Practica libre" = repasa primero lo mas flojo (fallos y caja baja) sin tocar el calendario (Q.cram).
  Tags de Prog4 reforzados por los errores frecuentes de Luca: Etiqueta (estereotipo), Destino, Mensaje, Notacion (numeracion, multiobjeto, nombre/anonimo, dos puntos).
  RONDAS: cada RN=10 tarjetas resueltas hay una pantalla de ronda (aciertos, tiempo, vuelve a empezar con el siguiente tema). La barra fina bajo el contador es una RESERVA de tiempo (RES0 s, tope RMAX): baja solo mientras pensas (se frena al ver la respuesta y con la pestaña oculta), cada acierto a la primera suma ACI s. Si sobra reserva al cerrar la ronda: +10 XP. Nunca penaliza ni corta. Al volver a la pestaña aparece 'Volviste'.
  Si una tarjeta menciona el diagrama de clases, el enunciado debe mostrarlo ('Diagrama de clases:  A ──> B *').
  PRACTICO 4 Prog4 (solucion): tags Enlaces, Borrado, Iteración. OJO convención: ese práctico dibuja el origen como :Sistema y escribe 1*[foreach]; el parcial de Luca corrigió :Controlador. Las tarjetas usan Controlador. Confirmar con el docente si ambas valen.
  ESTRATEGIA (Lógica): tarjetas sobre el estado de la derivación y la recursión armar-meta / desarmar-hipótesis.
  PRACTICOS: las tarjetas de Lógica reflejan los prácticos 4 (proposicional) y 8 (predicados e igualdad): se cita 'Práctico N · ej' en la primera línea. Tags: Primer paso (teoremas), Detectar error (ej. 5 / ej. 2), Leer derivación (Γ y ρ), Igualdad (I=, E=). Notacion del curso: φ ψ σ; ⊥ se obtiene con E¬; hojas sin corchetes = Γ.
  QUIZ: las preguntas 'Quiz ejercicios' se copiaron de const Q de prog4.html y logica.html (tag 'Quiz ejercicios'). Si se agregan preguntas a esos Q, agregarlas tambien aca como mc(...). Sus opciones no tienen motivo por opcion (se muestra solo la explicacion).
  ETIQUETA: las opciones son el MENSAJE completo con cada estereotipo (no etiquetas sueltas); el estereotipo es del receptor.
  DESLIZAR (pestaña 3, estado propio 'sw1'): SWC = cadenas de decisiones binarias sw(subj,tag,ctx,[st(pregunta,correcta,incorrecta,motivo,fragmento)],salida). Cada tarjeta de Repaso larga se descompone en pasos atómicos A/B; la correcta cae al azar a izquierda o derecha (deslizar, flechas o tocar). Sin 'salida' la cadena es suelta (sin armado). Errores vuelven a los 3 pasos. Nivel cada 25 aciertos. Agregar cadenas al final de SWC; no toca el mazo de Repaso. Las de Lógica muestran su árbol creciendo si tienen entrada en TRS (mismo título).
  MUSICA (pestaña 4, estado 'mu1'): estilo Simon en un bajo de 6 cuerdas BEADGC (25 trastes (0-24)). MSEC = [cancion,artista,parte,'tónicas separadas por espacio']; cada tónica ilumina todas sus posiciones (trastes 0-24) y vale cualquiera (misma nota); al acertar se guarda {s,f} en MU.seq[k] y en las demostraciones siguientes suena esa posición (si no hay, mLow). La secuencia crece de a una desde 2. En acordes con bajo (ej. D/F#) la tónica es la nota del bajo (F#). Agregar partes al final de MSEC. Las tónicas vienen de cifrados de internet (verificar con el disco).
  PROG4 POR LINEAS: EXS (tras SWC) describe postularse y aceptarPostulacion línea a línea (n,from,op,pa,to,res,cond,t); lineSteps genera los pasos atómicos y el contexto muestra operación, clases y las últimas líneas ya dibujadas. Para otro ejercicio, agregar un objeto a EXS. Cada tarjeta de línea muestra el diagrama (swDg/dgm, copia de dg de prog4.html) con las líneas ya dibujadas en gris y la flecha actual en trazo discontinuo que se completa según los pasos respondidos (cada paso lleva .k: n, op, pa, to, cond, q, st).
  OPCIONES: en d (distractores) cada opcion puede llevar motivo: "texto||por que no". Los distractores deben ser TENTADORES (errores reales: regla invertida, eliminacion sin la premisa que pide, regla de otro conector), nunca absurdos. El motivo se muestra al elegirla.
  DOMINIO: boton 'Ver dominio' (DOM) en tarjetas Prog4 de Etiqueta/Destino/Mensaje/Decision (DOMT). Cada tarjeta Prog4 debe ser consistente con DOM (viene de CL y M en prog4.html). Lógica: toda tarjeta muestra 'Tengo:' y 'Meta:' completos. mc(...,w,h): h = pista propia de la tarjeta (si no, HINT del tag).
  DIDACTICA: el escenario de una tarjeta debe permitir TRAZAR la respuesta (mostrar de donde salio cada objeto: find, create, next, firma de la operacion,
  asociacion del diagrama de clases) sin escribir la respuesta en el enunciado. DEF = definicion de cada opcion (se muestra como "Elegiste X..." al fallar; clave = etiqueta
  o primer token de la opcion, ej. "E∧"). HINT = pregunta clave por tag (boton Pista antes de responder y siempre visible tras un error). Al sumar un tag nuevo, agregar su HINT.
  Agregar tarjetas: sumarlas al final de P4A o LGA. tag = subtema; la lista de tags se arma sola y alimenta las barras de progreso.
  Estado guardado en localStorage "est2": {c:{id:{b:caja,due:timestamp,l:fallos,n:repasos}}, nw: nuevas hoy, nm: nuevas por dia, xp, xpd, stk (racha), last, day}.
  Cajas: IV=[0,1,3,7,14,30,60] dias. Otra vez = caja 0 y vuelve en 10 min; Dificil = misma caja con la mitad del intervalo; Bien = +1 caja; Facil = +2.
  En mc: acierto a la primera = Bien, error = Otra vez. Las falladas se reencolan 4 lugares mas adelante hasta acertarlas (no cambian el calendario de nuevo).
  Dominada = caja >= 3 (intervalo de 7 dias o mas). Las nuevas se intercalan entre materias (ilv) para mezclar Prog4 y Logica.
  Las apps embebidas guardan su progreso aparte (claves lv, pg2, er en Prog4; lvn, ern en Logica): no hay choque con "est2".
  ERRORES (pestaña 5, estado 'err1'): logA(w,s,g,ok,info) cuenta intentos por pestaña|materia|tag (st) y guarda cada fallo en log (tope 4000): t, w (rep/sw/mu), s, g, q, x (contexto), a (correcta), p (elegida), ms (tiempo hasta responder), rp (era reintento), b (caja previa en Repaso). Lo llaman pick (Repaso), swChoose (Deslizar) y muTap (Música). 'Copiar para Claude' arma un texto compacto: tasas por tag, confusiones correcta→elegida y fallos agrupados por pregunta (desde la última exportación o todo), más los conteos 'er'/'ern' de las apps embebidas. Sirve para que Claude ajuste el algoritmo y las tarjetas según lo que más cuesta.
LIMITES: el iframe se ajusta a la altura del contenido cada 500 ms (solo funciona porque es el mismo origen). Las apps embebidas no siguen el
  selector de tema del visor, solo el modo claro/oscuro del sistema.
-->

<script>
const $=i=>document.getElementById(i),V=$("v");
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const hs=s=>{let x=7;for(const c of s)x=(x*31+c.charCodeAt(0))|0;return(x>>>0).toString(36)};
const sh=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const SUBJ={p4:{n:"Prog4",c:"s-p4"},lg:{n:"Lógica",c:"s-lg"}};
const mc=(s,g,q,a,d,w,h)=>({k:"mc",s,g,q,a,d,w,h}),fc=(s,g,q,b)=>({k:"fc",s,g,q,b});

/* ---- Tarjetas (cortas): Prog4 ---- */
const P4A=[
mc("p4","Etiqueta","est ejecuta generarPostulacion(opc)\nDiagrama de clases:  Estudiante ──> Postulacion *   (sin flecha hacia OfertaPasantia)\n¿Cómo dibujo el envío de agregarPostulacion(p) a opc?","est → opc : agregarPostulacion(p)  «parameter»",["est → opc : agregarPostulacion(p)  «local»||opc no salió de un find/create/next dentro de esta operación: llegó por la firma.","est → opc : agregarPostulacion(p)  «association»||No hay flecha Estudiante → OfertaPasantia en el diagrama de clases.","est → opc : agregarPostulacion(p)||Todo mensaje lleva estereotipo: hay que decir cómo conoce est a opc."],"opc está en la firma de generarPostulacion(opc)."),
mc("p4","Etiqueta","1: Controlador → :Estudiante * : est := find(ci)\n¿Cómo dibujo el mensaje 2 a est?","2: Controlador → est : generarPostulacion(opc)  «local»",["2: Controlador → est : generarPostulacion(opc)  «association»||est salió del find del mensaje 1, no de una flecha del diagrama de clases.","2: Controlador → est : generarPostulacion(opc)  «parameter»||est no está en la firma de la operación: lo obtuvo con el find.","2: Controlador → :Estudiante * : generarPostulacion(opc)  «association»||generarPostulacion es de un estudiante concreto, no de la colección."],"est es el resultado del find 1: queda en una variable local."),

mc("p4","Enlaces","Práctico 4 · 2a\nEl link va de A hacia B: A guarda la referencia a la B nueva.\n:A hizo b := create(id).\n¿Qué mensaje sigue?","add(b), de :A a :B * (la colección)",["setA(a), de :B a sí mismo||Eso guarda la referencia de B hacia A; acá la referencia va de A hacia B.","find(id) a :B *||El objeto ya existe y lo tengo en b: no hay nada que buscar.","destroy() a b||destroy elimina la instancia, no la enlaza."],"A mantiene una colección de B: después de crear b, lo agrega con add."),
mc("p4","Enlaces","Práctico 4 · 2b\nEl link va de B hacia A: B guarda la referencia a su única A.\n:B hizo a := create(id).\n¿Qué mensaje sigue?","setA(a), de :B a sí mismo",["add(a) a :A *||add es para colecciones; B guarda una sola A.","add(b), de :A a :B *||Eso corresponde al link de A hacia B.","setB(b) a :A||Eso guardaría la referencia en A, no en B."],"B guarda su A con setA, un mensaje que se envía a sí misma."),
mc("p4","Enlaces","Práctico 4 · 2c\nLink en los dos sentidos. a:A hace b := create(id, a).\n¿Para qué se pasa a como parámetro?","Para que b guarde su referencia con setA(a)",["Para que A pueda hacer add(b)||add(b) usa b, que ya devolvió el create.","Para identificar la instancia en la colección||Identificar es el id, no el objeto a.","Es opcional: no cambia el diagrama||Sin a, B no tendría qué guardar en setA."],"Se pasa a sí misma para que la instancia nueva pueda guardar la referencia de vuelta."),
mc("p4","Enlaces","Práctico 4 · 2c\na:A hace 1: b := create(id, a) y 2: add(b).\n¿Cómo se numera el setA(a) que b se envía a sí mismo?","1.1, porque lo dispara el create",["1.2||Es el primer (y único) mensaje que dispara el create.","2.1||Cuelga del add, que no lo dispara.","3||Ocurre dentro del create, no después del add."],"Lo que dispara el 1 cuelga de él: 1.1."),
mc("p4","Borrado","Práctico 4 · 2d\nA creó b y quiero eliminar solo el link (A guarda una colección de B).\n¿Qué envía A?","remove(id) a :B *",["destroy() a b||destroy elimina la instancia; acá solo hay que desengancharla.","setA(NULL) a b||Eso corresponde al link de B hacia A.","find(id) y nada más||find solo busca, no desengancha."],"Para sacar el link de la colección: remove(id)."),
mc("p4","Borrado","Práctico 4 · 2d\nQuiero eliminar el link y también la instancia b de B (la creó A).\n¿Qué secuencia envía A?","b := find(id), remove(id) a :B *, destroy() a b",["remove(id) y listo||Eso solo elimina el link: la instancia sigue existiendo.","destroy() a :B *, sin find||destroy va a la instancia concreta b, no a la colección.","destroy() a b y después remove(id)||Quedaría en la colección una referencia a un objeto ya destruido."],"Primero la busco, saco el link y por último destruyo la instancia."),
mc("p4","Borrado","Práctico 4 · 2d\nEl link va de B hacia A y quiero eliminar solo el link.\n¿Qué hace :B?","setA(NULL), a sí mismo",["remove(id) a :A *||B guarda una sola referencia, no una colección.","destroy() a :A||Eso destruye la instancia; acá solo se desengancha."],"B borra su referencia a A poniéndola en NULL."),
mc("p4","Borrado","Práctico 4 · 2d\n¿Destruir un link equivale a destruir la instancia?","No: se desengancha el objeto y puede seguir existiendo",["Sí: sin link el objeto queda inútil||Puede tener otros links o seguir en otra colección.","Sí, siempre||Son operaciones distintas: remove o setX(NULL) contra destroy()."],"En general, quien crea la instancia es responsable de destruirla; el link es otra cosa."),
mc("p4","Iteración","Práctico 4 · 3a\nRecorro todas las instancias de A.\n¿Cómo escribo el mensaje que obtiene cada una?","1*[foreach]: a := next() a :A *",["1: a := find() a :A *||find busca por clave; para recorrer todas se usa next con iteración.","1*: a := create() a :A *||create construye un objeto nuevo.","1: next() a a:A||next va a la colección, no a una instancia."],"Iteración: * pegado al número y next() sobre el multiobjeto. El práctico además escribe [foreach]."),
mc("p4","Iteración","Práctico 4 · 3a\n¿Qué indica [foreach] en «1*[foreach]: a := next()»?","Que el mensaje se repite para cada instancia de la colección",["Que a es un parámetro||Un parámetro va entre paréntesis.","Que hay una condición de corte||La condición de corte es otra cosa: se anota aparte."],"Es la marca del recorrido sobre todos los elementos."),
mc("p4","Iteración","Práctico 4 · 3a\nCada a:A debe decir si tiene algún R con val > v.\n¿Quién compara val con v?","a:A, que recorre sus R",["El Controlador, pidiendo todos los val||Se acopla con extraños y se expone la estructura interna de A.","r:R, comparando con los otros R||R no conoce a los demás R."],"La condición se resuelve adentro: a recorre sus R y pide val a cada uno."),
mc("p4","Iteración","Práctico 4 · 3b\nLa asociación se navega de B hacia A: cada b devuelve las A que cumplen.\n¿Qué hago con los resultados de cada b?","Los uno (unión de conjuntos) para eliminar repetidos",["Los concateno||Una misma A puede aparecer por varias B y quedaría repetida.","Me quedo con los de la primera b||Perdería las A que cumplen a través de otras B.","Los ordeno por id||Ordenar no elimina los repetidos."],"Una misma A puede aparecer en varias B: resultado = resultado unión aa."),
mc("p4","Iteración","Práctico 4 · 3a y 7a\nBusco si algún elemento cumple una condición (por ejemplo val > v).\n¿Cuándo corto la iteración?","Apenas encuentro uno que cumple, y retorno true",["Cuando termina la colección||Eso sirve para acumular; para «existe alguno» basta con el primero.","Nunca: siempre recorro todo||Seguir recorriendo no cambia el resultado y desperdicia mensajes."],"Para un «existe alguno»: se detiene y retorna true en cuanto se cumple."),

mc("lg","Leer derivación","En Γ ⊢ ρ, ¿qué es Γ?","Las hipótesis sin cancelar (sin corchetes)",["Las hipótesis canceladas||Las canceladas ya no cuentan: se descargaron.","Todas las fórmulas del árbol||Solo cuentan las hojas sin cancelar.","La última regla aplicada||Γ es un conjunto de fórmulas, no una regla."],"Γ = hojas abiertas; ρ = la fórmula de la raíz."),
mc("lg","Leer derivación","Práctico 4 · 2a\nDerivación de (φ→¬φ)→¬φ. La hoja φ→¬φ no tiene corchetes; [φ]¹ se cancela con I¬(1); el I→ final no cancela nada.\n¿Qué Γ sirve?","Γ = {φ→¬φ} (o cualquier conjunto que la incluya)",["Γ = ∅||φ→¬φ quedó abierta, así que tiene que estar en Γ.","Γ = {φ}||φ se canceló con I¬(1).","Γ = {¬φ}||¬φ es una fórmula intermedia, no una hoja."],"Γ puede tener fórmulas de más (por eso piden tres Γ distintos)."),
mc("lg","Leer derivación","Práctico 4 · 2b\nDerivación de (φ→¬φ)→¬φ con [φ→¬φ]² y [φ]¹ ambas canceladas (I¬(1) e I→(2)).\n¿Qué Γ sirve?","Γ = ∅: es un teorema",["Γ = {φ→¬φ}||Se canceló con I→(2).","Γ = {φ}||Se canceló con I¬(1).","Γ = {φ, φ→¬φ}||Ambas están canceladas."],"Sin hojas abiertas, ⊢ ρ."),
mc("lg","Leer derivación","Práctico 4 · 2c\nIgual que 2b pero la hoja φ (la usada en E→) no tiene corchetes.\n¿Qué Γ sirve?","Γ = {φ} (o un superconjunto)",["Γ = ∅||φ quedó sin cancelar.","Γ = {φ→¬φ}||Esa sí se canceló con I→(2).","Γ = {¬φ}||¬φ es una fórmula intermedia."],"Las hojas abiertas definen Γ."),
mc("lg","Leer derivación","Práctico 4 · 4\nTengo ψ (de φ→ψ y φ) y γ. Necesito llegar a ⊥ usando ¬(ψ∧γ).\n¿Qué pasos faltan?","I∧ para armar ψ∧γ, y E¬ con ¬(ψ∧γ)",["E∧ sobre ψ y γ||No hay ninguna conjunción que separar.","I¬ directo||I¬ concluye una negación; antes hay que llegar a ⊥.","E→ con ψ y γ||No hay ninguna implicación entre ellas."],"ψ∧γ choca con ¬(ψ∧γ): E¬ da ⊥."),
mc("lg","Leer derivación","Práctico 4 · 4\nLa derivación sigue ⊥ → ¬γ → φ→¬γ.\n¿Qué cancela cada regla?","I¬ cancela γ; I→ cancela φ",["I¬ cancela φ; I→ cancela γ||Al revés: ¬γ se prueba suponiendo γ.","Las dos cancelan φ||I¬ cancela la suposición del consecuente que niega.","Ninguna cancela nada||Ambas cancelan la hipótesis supuesta."],"¬γ: supuse γ. φ→¬γ: supuse φ."),
/* Igualdad (practico 8 ej. 7 y 8) */
mc("lg","Igualdad","¿Qué da la regla I= (reflexividad)?","t =′ t, sin hipótesis",["x =′ y a partir de x||No se puede obtener una igualdad entre dos variables distintas sin hipótesis.","φ(y) a partir de x =′ y||Eso es E= (sustitución).","(∀x)(x =′ y)||Una igualdad con ∀ no sale de I=."],"I= solo prueba que cada término es igual a sí mismo."),
mc("lg","Igualdad","Tengo x =′ y y φ(x).\nQuiero φ(y).\n¿Qué regla?","E=: sustituyo x por y (t libre para x)",["I=: reflexividad||I= solo da t =′ t.","E∀: instancio||No hay ningún ∀ que instanciar.","I∃: busco un testigo||La meta no es un ∃."],"E= reemplaza iguales dentro de una fórmula."),
mc("lg","Igualdad","Práctico 8 · 7c\nTengo: nada\nMeta: (∀x)(∃y)x =′ y\n¿Cómo la armo?","I∀ (x arbitraria), I∃ con y := x, y x =′ x por I=",["E=: de x =′ y saco ∃y||E= necesita una igualdad ya probada y una fórmula donde sustituir.","E∀: instancio ∀x||No hay ningún ∀ que instanciar.","RAA: supongo ¬(∀x)(∃y)x =′ y||Es un rodeo: la meta se arma con la introducción de su conector."],"Armo ∀ (x arbitraria) y ∃ (testigo x); la igualdad sale de I=."),
mc("lg","Igualdad","Práctico 8 · 7a\nTengo: (∀x)(∀y)x =′ y\nMeta: (∀y)(∀x)y =′ x\n¿Cómo la armo?","I∀ dos veces (y, x arbitrarias) y E∀ dos veces sobre la hipótesis",["E=: sustituyo x por y||No hace falta: la hipótesis ya da cualquier igualdad con E∀.","I∃: busco un testigo||No hay ningún ∃.","I=: reflexividad||I= da t =′ t; acá necesito y =′ x con variables distintas."],"La hipótesis ya dice que todo es igual a todo: instancio y armo ∀."),
/* Cancelar */
mc("lg","Cancelar","Cierro con I→ y concluyo φ→ψ.\n¿Qué hipótesis cancelo?","φ, el antecedente (si la usé)",["ψ, el consecuente||ψ es lo que concluyo, no lo que supuse.","Todas las abiertas||Solo se cancela el antecedente; las demás quedan abiertas.","Ninguna: I→ no cancela||I→ cancela la hipótesis del antecedente."],"La cancelación puede ser vacía si nunca usé φ."),
mc("lg","Cancelar","Cierro con I¬ y concluyo ¬φ.\n¿Qué cancelo?","φ",["¬φ||¬φ es la conclusión, no la hipótesis.","⊥||⊥ es lo que obtengo, no lo que supuse.","¬¬φ||I¬ supone φ, no su doble negación."],"Supuse φ y llegué a ⊥."),
mc("lg","Cancelar","Cierro con RAA y concluyo φ.\n¿Qué cancelo?","¬φ",["φ||φ es la conclusión, no la hipótesis.","⊥||⊥ es lo que obtengo, no lo que supuse.","¬¬φ||RAA supone ¬φ, no su doble negación."],"Supuse ¬φ y llegué a ⊥."),
mc("lg","Cancelar","Cierro con E∨ sobre φ∨ψ.\n¿Qué cancelo?","φ y ψ, una en cada rama",["Solo φ∨ψ||Esa es la premisa mayor; no se cancela.","Solo φ, en la rama izquierda||También hay que cancelar ψ en la otra rama.","Nada||E∨ cancela las dos suposiciones."],"Las dos suposiciones, con etiquetas distintas."),
mc("lg","Cancelar","E∃ elimina el ∃: de (∃x)P(x) paso a trabajar con P(x). Al cerrar con E∃, ¿qué hipótesis queda entre corchetes [ ]ⁿ?","P(x), la suposición con la que trabajé",["(∃x)P(x)||No se corchetea: sigue como premisa abierta (queda en Γ); lo que desaparece es su ∃ al pasar a P(x).","ψ||ψ es la conclusión.","P(a)||E∃ supone el testigo con una variable nueva x, no con una constante."],"E∃ quita el ∃ (se pasa a trabajar con P(x), x nueva) y al cerrar se cancela esa suposición P(x); (∃x)P(x) queda como premisa."),
mc("lg","Cancelar","La hipótesis φ es una premisa del enunciado (Γ).\n¿La encierro entre corchetes?","No: solo se cancelan las que supuse yo",["Sí, con una etiqueta||Las premisas de Γ quedan abiertas.","Sí, al usar I→||I→ cancela lo que supuse para esa regla, no las premisas."],"Las premisas quedan abiertas."),
/* Condiciones (∗) con casos concretos */
mc("lg","Condición (∗)","Aplico E∀ a (∀x)(∃y)Q(x,y) con t = y.\n¿Se puede?","No: y queda capturada por ∃y",["Sí: y es un término||Cualquier término sirve solo si es libre para x; y queda capturada.","Sí: y es una variable nueva||No es nueva: aparece ligada en la fórmula."],"t tiene que ser libre para x: daría (∃y)Q(y,y)."),
mc("lg","Condición (∗)","Aplico E∀ a (∀x)(∃y)Q(x,y) con t = a.\n¿Se puede?","Sí: a es libre para x",["No: hay un ∃ adentro||Un cuantificador no impide sustituir si t no queda capturado.","No: a no es una variable||t puede ser cualquier término libre para x."],"Ningún cuantificador captura a."),
mc("lg","Condición (∗)","Meta: (∀x)P(x). Hipótesis abierta: Q(x).\n¿Puedo usar I∀?","No: x está libre en una hipótesis abierta",["Sí: Q(x) no es P(x)||I∀ no mira qué fórmula es la hipótesis, sino si x aparece libre.","Sí: siempre se puede||I∀ pide x ∉ FV de las hipótesis abiertas."],"x tiene que ser arbitraria."),
mc("lg","Condición (∗)","Meta: (∀x)P(x). Hipótesis abierta: Q(y).\n¿Puedo usar I∀?","Sí: x no está libre en ninguna hipótesis abierta",["No: hay una hipótesis abierta||Que haya hipótesis abiertas no alcanza: importa si x está libre en ellas.","No: y es libre||y no es la variable que estoy generalizando."],"Solo importa x."),
mc("lg","Condición (∗)","Tengo (∃x)P(x) y quiero concluir ψ = P(x) con E∃.\n¿Se puede?","No: x es libre en ψ",["Sí: x es una variable nueva||x aparece libre en la conclusión ψ.","Sí: E∃ admite cualquier ψ||E∃ exige x ∉ FV(ψ)."],"E∃ exige que x no esté libre en ψ."),
mc("lg","Condición (∗)","Tengo P(f(a)). Quiero concluir (∃x)P(x) con I∃.\n¿Se puede?","Sí: t = f(a) es libre para x",["No: f(a) no es una variable||t puede ser cualquier término libre para x.","No: falta un testigo||f(a) es el testigo."],"Cualquier término sirve si es libre para x."),
mc("lg","Condición (∗)","¿Es y libre para x en (∀y)P(x,y)?","No: queda capturada por ∀y",["Sí: y no cuantifica a x||La y que sustituiría a x quedaría dentro del alcance de ∀y.","Depende de la regla||Es una propiedad de la fórmula, no de la regla."],"Daría (∀y)P(y,y)."),
mc("lg","Condición (∗)","¿Es f(x) libre para x en ¬P(x)?","Sí: nada la captura",["No: f(x) contiene a x||Ser libre para x no prohíbe que el término contenga a x.","Depende de las hipótesis||Es una propiedad de la fórmula, no de las hipótesis."],"Sin cuantificadores no hay captura."),
/* Fórmulas */
mc("lg","Fórmulas","Variables libres en (∀x)P(x,y)","Solo y",["x e y||x queda ligada por ∀x.","Solo x||x está ligada; la libre es y."],"x queda ligada por ∀x."),
mc("lg","Fórmulas","En (∀x)P(x) ∧ Q(x)\n¿La x de Q(x) es libre?","Sí",["No||∀x solo alcanza a P(x): ∀ liga más fuerte que ∧."],"∀x solo alcanza a P(x)."),
mc("lg","Fórmulas","¿Cómo se lee φ∨ψ∧σ?","φ∨(ψ∧σ)",["(φ∨ψ)∧σ||En la app ∧ liga más que ∨."],"∧ liga más que ∨."),
/* Estrategia: movimientos recursivos (armar meta / desarmar hipotesis) y estado de la derivacion */
mc("lg","Estrategia","Tengo: φ→ψ\nMeta: ψ\n¿Qué subobjetivo aparece?","Probar φ (y después E→)",["Probar ψ||Es la meta original: sería circular.","Suponer ψ||Si lo supongo no pruebo nada.","Probar ψ→φ||No se necesita la recíproca."],"Para usar una implicación hay que conseguir su antecedente: un subobjetivo más chico."),
mc("lg","Estrategia","Tengo: ¬φ\nMeta: ⊥\n¿Qué subobjetivo aparece?","Probar φ y juntar con ¬φ por E¬",["Probar ¬¬φ||Es más fuerte de lo necesario.","Aplicar E⊥||E⊥ parte de un ⊥ que todavía no tengo.","Suponer φ||Suponer no basta: hay que probarla desde lo que tengo."],"Una negación en las hipótesis pide su φ para contradecirla."),
mc("lg","Estrategia","Tengo: q→p, q∧r\nMeta: p (atómica)\n¿Cómo sigo?","E∧ para sacar q y E→ con q→p",["I→: supongo q||La meta p no es una implicación.","I∧: junto q y r||Daría q∧r, no p.","RAA enseguida||RAA va al final: antes miro si p sale de las hipótesis."],"Meta atómica: busco si está o si sale eliminando hipótesis; si no, RAA."),
mc("lg","Estrategia","Meta: φ→(ψ→σ)\nHago I→ dos veces.\n¿Qué queda?","Hipótesis abiertas φ y ψ; meta σ",["Hipótesis abiertas ψ y σ; meta φ||Se suponen los antecedentes, no los consecuentes.","Sin hipótesis; meta σ||Las suposiciones siguen abiertas hasta que las cancelen las I→.","Hipótesis φ→(ψ→σ); meta ⊥||La meta es σ, no ⊥."],"Cada I→ baja un nivel: sube una hipótesis y la meta pasa a ser el consecuente."),
mc("lg","Estrategia","Meta: φ\nAplico RAA.\n¿Qué queda?","Hipótesis nueva ¬φ; meta ⊥",["Hipótesis nueva φ; meta ⊥||Eso es I¬ (para probar ¬φ).","Hipótesis nueva ¬φ; meta φ||La meta pasa a ser ⊥.","Sin cambios||RAA agrega la suposición ¬φ."],"RAA cambia el problema: ahora busco una contradicción."),
mc("lg","Estrategia","Tengo: φ∨ψ\nMeta: χ\n¿Qué pruebo en cada rama de E∨?","χ, suponiendo φ en una rama y ψ en la otra",["φ y ψ por separado||Hay que llegar a la misma conclusión χ en ambas.","χ∨χ||E∨ concluye χ, no una disyunción.","φ∧ψ||No se pueden suponer los dos a la vez."],"Dos subproblemas con la misma meta χ."),
mc("lg","Estrategia","Práctico 8 · 10c\nTengo: ∀z(P(x,z)∧P(y,z)→P(f(x,y),z)), P(x,f(y,x)), P(y,f(y,x))\nMeta: P(f(x,y), f(y,x))\n¿Con qué término instancio z?","z := f(y,x): el que aparece en la meta y en las otras hipótesis",["z := x||No coincide con las hipótesis ni con la meta.","z := f(x,y)||No coincide con los P(·, f(y,x)) que tengo.","Una variable nueva||Para E∀ elijo el término que me sirve; la variable nueva es para I∀."],"En E∀ el término se elige mirando la meta y los antecedentes que ya tengo."),
mc("lg","Estrategia","Meta con conector principal y hipótesis con conectores.\n¿Qué conviene hacer primero?","Armar la meta con su introducción; desarmar hipótesis cuando falte material para un subobjetivo",["Desarmar todas las hipótesis antes de tocar la meta||Se llena de fórmulas que quizás no hacen falta: guiate por la meta.","Aplicar RAA de entrada||RAA es el último recurso, para metas sin conector útil.","Elegir cualquier regla aplicable||Sin criterio la derivación se desordena."],"Se repite en cada subobjetivo hasta llegar a fórmulas atómicas."),
/* Quiz de la pestaña Ejercicios Lógica (viene de logica.html: const Q) */
mc("lg","Quiz ejercicios","Querés probar φ→ψ. ¿Qué regla usás y qué se cancela?","I→: suponés φ, llegás a ψ y cancelás φ",["I→: suponés ψ, llegás a φ y cancelás ψ","E→: tomás φ y ψ como premisas","RAA: suponés ¬ψ y cancelás ¬ψ"],"I→ cancela el antecedente: de la hipótesis φ deducís ψ y queda φ→ψ."),
mc("lg","Quiz ejercicios","Querés probar ¬φ. ¿Qué regla usás?","I¬: suponés φ, llegás a ⊥ y cancelás φ",["RAA: suponés ¬φ, llegás a ⊥ y cancelás ¬φ","E¬ aplicada a φ","E⊥ desde φ"],"I¬ concluye ¬φ cancelando φ. RAA concluye φ cancelando ¬φ: no las confundas."),
mc("lg","Quiz ejercicios","¿Qué premisas necesita E¬ y qué concluye?","¬φ y φ; concluye ⊥",["φ y ψ; concluye φ∧ψ","⊥; concluye cualquier φ","φ→⊥; concluye ¬φ"],"E¬ junta una fórmula y su negación para llegar a ⊥. En el examen: primero ¬φ y después φ."),
mc("lg","Quiz ejercicios","¿Qué hace E⊥?","De ⊥ concluye cualquier fórmula",["De φ y ¬φ concluye ⊥","Cancela ¬φ y concluye φ","De ⊥ concluye ¬φ cancelando φ"],"Ex falso: de una contradicción sale cualquier cosa. Ej. 2c: de ⊥ se concluye (∀x)Q(x)."),
mc("lg","Quiz ejercicios","Ninguna introducción ni eliminación directa te lleva a la conclusión φ. ¿Qué intentás?","RAA: suponer ¬φ y buscar ⊥",["I¬ suponiendo φ","I→ suponiendo ⊥","E⊥ sin tener ⊥"],"RAA es el recurso general: suponés ¬φ, llegás a ⊥ y cancelás ¬φ."),
mc("lg","Quiz ejercicios","En E∨ (de φ∨ψ a σ), ¿qué se cancela?","φ en una rama y ψ en la otra; ambas ramas llegan a σ",["Solo φ∨ψ","Solo ¬σ","Nada"],"Hay dos derivaciones de σ, una bajo φ y otra bajo ψ; las dos hipótesis se cancelan con etiquetas distintas."),
mc("lg","Quiz ejercicios","Para I∨ con conclusión φ∨ψ, ¿qué necesitás?","Probar φ o probar ψ (alcanza uno)",["Probar φ y ψ","Probar ¬φ","Probar φ→ψ"],"I∨ solo pide un disyunto. En 3a hay que elegir el que se puede probar."),
mc("lg","Quiz ejercicios","¿Qué premisas tiene E→ para concluir ψ?","φ→ψ y φ",["φ→ψ y ψ","φ y ψ","¬ψ→¬φ"],"Modus ponens. La decisión clave es el antecedente φ."),
mc("lg","Quiz ejercicios","¿Condición lateral de E∀ (de (∀x)φ(x) a φ(t))?","t libre para x en φ",["x ∉ FV de las hipótesis abiertas","x ∉ FV(ψ) ni de las hipótesis abiertas","Ninguna"],"Al sustituir x por t no se debe capturar ninguna variable de t. Ej. 2c: f(x) libre para x en ¬P(x)."),
mc("lg","Quiz ejercicios","¿Condición lateral de I∃ (de φ(t) a (∃x)φ(x))?","t libre para x en φ",["x ∉ FV de las hipótesis abiertas","x ∉ FV(ψ) ni de las hipótesis abiertas","Ninguna"],"Igual que E∀: t libre para x en φ. Ej. 3b: x libre para x en P(x,x)."),
mc("lg","Quiz ejercicios","¿Condición lateral de I∀ (de φ(x) a (∀x)φ(x))?","x ∉ FV de las hipótesis abiertas (no canceladas)",["t libre para x en φ","x ∉ FV(ψ) únicamente","Ninguna"],"Si x es libre en una hipótesis abierta no es arbitraria y no se puede generalizar."),
mc("lg","Quiz ejercicios","¿Condición lateral de E∃ (de (∃x)φ(x) y ψ bajo [φ(x)])?","x ∉ FV(ψ) ni de las hipótesis abiertas distintas de φ(x)",["t libre para x en φ","x ∉ FV(φ)","Ninguna"],"Ej. 3b: x ∉ FV((∃x)P(x,x), (∀x)(∀y)(∀z)(...))."),
mc("lg","Quiz ejercicios","¿Cuándo una hipótesis no lleva corchetes ni etiqueta?","Cuando es premisa del juicio (Γ) y no se cancela",["Cuando se cancela con RAA","Cuando se usa dos veces","Cuando es ⊥"],"Las canceladas van como [φ]ⁿ; las premisas de Γ quedan abiertas."),
mc("lg","Quiz ejercicios","¿Puede aplicarse I→ sin cancelar ninguna hipótesis?","Sí, la cancelación puede ser vacía",["No, siempre debe cancelar φ","Solo si ψ es ⊥","Solo dentro de RAA"],"En 3a, β→γ se obtiene de γ por I→ sin cancelar β."),
mc("lg","Quiz ejercicios","¿Qué necesita I↔ para concluir φ↔ψ?","φ→ψ y ψ→φ",["φ y ψ","φ∧ψ","¬φ y ¬ψ"],"I↔ junta las dos implicaciones; en 3a se derivan por separado.")
];

function pfT(n,i,done){const v=x=>done||i>=x,nw=x=>!done&&x>0&&i==x;
 if(!v(n.at))return'<span class="pf ph">?</span>';
 const c=n.o.c&&v(n.o.ca),fv=!n.o.fa||v(n.o.fa),f=!fv?'<span class="pf ph">?</span>':`<span class="pf${nw(n.at)||nw(n.o.fa)||(c&&!n.k.length&&nw(n.o.ca))?" nw":""}">${c&&!n.k.length?"["+esc(n.f)+"]<sup>"+n.o.c+"</sup>":esc(n.f)}</span>`;
 if(!n.k.length&&!n.o.open)return f;
 const rk=n.r&&v(n.ra),kv=n.k.some(x=>v(x.at));

function erTxt(all){const L=E1.log.filter(e=>all||e.t>E1.exp);let o=`ERRORES DE ESTUDIO (${all?"todo el historial":"desde la última exportación"}) · ${L.length} fallos`+(L.length?` · ${fd(L[0].t)} a ${fd(L[L.length-1].t)}`:"")+"\n\n## Tasa por tag (fallos/intentos, histórico)\n";
 Object.entries(E1.st).map(([k,[ok,n]])=>[k,n-ok,n]).filter(x=>x[1]).sort((a,b)=>b[1]/b[2]-a[1]/a[2]).forEach(([k,f,n])=>{const[w,s,g]=k.split("|");o+=`- ${WN[w]}/${SN[s]}/${g}: ${f}/${n} (${Math.round(f/n*100)}%)\n`});
 const cf={};L.forEach(e=>{const k=SN[e.s]+" · "+e.a+"  →  "+e.p;cf[k]=(cf[k]||0)+1});const cfs=Object.entries(cf).filter(x=>x[1]>1).sort((a,b)=>b[1]-a[1]).slice(0,25);
 if(cfs.length){o+="\n## Confusiones repetidas (correcta → elegí)\n";cfs.forEach(([k,n])=>o+=`- ${n}× ${k}\n`)}
 const G={};L.forEach(e=>{const k=e.w+"|"+e.g+"|"+e.q+"|"+e.p;const x=G[k]||(G[k]={e,n:0,ms:0,rp:0});x.n++;x.ms+=e.ms||0;x.rp+=e.rp?1:0;x.last=e.t});
 o+="\n## Fallos agrupados (más repetidos primero)\n";Object.values(G).sort((a,b)=>b.n-a.n||b.last-a.last).forEach(({e,n,ms,rp})=>{o+=`\n[${WN[e.w]}/${SN[e.s]}/${e.g}${e.n?" paso "+e.n:""}] ${n}×${rp?" ("+rp+" en reintento)":""} · ${Math.round(ms/n/1000)} s promedio${e.b>=0&&e.b!==undefined?" · caja "+e.b:""}\n`+(e.x?"  Contexto: "+e.x.replace(/\n/g," / ")+"\n":"")+`  P: ${e.q.replace(/\n/g," / ")}\n  Correcta: ${e.a}\n  Elegí: ${e.p}\n`});
 const a=ld2("er"),b=ld2("ern");if(Object.keys(a).length||Object.keys(b).length){o+="\n## Apps de ejercicios (conteo por tipo)\n";Object.entries(a).forEach(([k,v])=>o+=`- Prog4: ${k}: ${v.n}\n`);Object.entries(b).forEach(([k,v])=>o+=`- Lógica: ${k}: ${v}\n`)}
 return o}
function erOpen(){const L=E1.log.filter(e=>ERW=="all"||e.w==ERW),nw=E1.log.filter(e=>e.t>E1.exp).length,st=Object.entries(E1.st).filter(([k])=>ERW=="all"||k.startsWith(ERW+"|")).map(([k,[ok,n]])=>[k.split("|"),n-ok,n]).filter(x=>x[1]).sort((a,b)=>b[1]/b[2]-a[1]/a[2]);
 let h=`<div class="row between"><b>${E1.log.length} errores guardados</b><span class="mut">${nw} nuevos desde la última exportación${E1.exp?" ("+fd(E1.exp)+")":""}</span></div>
 <div class="row" style="margin-top:8px;flex-wrap:wrap;gap:6px"><button class="btn pri" data-e="cp">Copiar para Claude (nuevos)</button><button class="btn" data-e="cpa">Copiar todo</button><button class="btn" data-e="dl">Descargar .txt</button></div>
 ${ERT?`<p class="mut" style="margin:8px 0 4px">Si no se copió solo, seleccioná el texto y copialo:</p><textarea id="ert" style="width:100%;height:140px;font:12px var(--m);background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:10px;padding:8px">${esc(ERT)}</textarea>`:""}
 <div class="row" style="margin-top:12px;gap:6px;flex-wrap:wrap">${[["all","Todo"],["rep","Repaso"],["sw","Deslizar"],["mu","Música"]].map(([k,t])=>`<button class="btn chip${ERW==k?" sel":""}" data-e="w" data-v="${k}">${t}</button>`).join("")}</div>
 <div class="card"><h2>Dónde fallo más</h2>${st.length?st.slice(0,15).map(([[w,s,g],f,n])=>`<div class="row between" style="gap:8px;margin:4px 0"><span>${esc(SN[s]+" · "+g)} <span class="mut">(${WN[w]})</span></span><span class="mut" style="white-space:nowrap">${f}/${n} · <b>${Math.round(f/n*100)}%</b></span></div>`).join(""):'<p class="mut" style="margin:0">Todavía no hay errores. Se guardan solos al estudiar en Repaso, Deslizar y Música.</p>'}</div>
 <div class="card"><h2>Últimos errores</h2>${L.slice(-40).reverse().map(e=>`<div style="border-top:1px solid var(--bd);padding:8px 0"><div class="mut" style="font-size:12px">${fd(e.t)} · ${WN[e.w]} · ${esc(SN[e.s]+" · "+e.g)}${e.ms?" · "+Math.round(e.ms/1000)+" s":""}</div><div>${esc(e.q.split("\n").pop())}</div><div style="font-size:14px"><span style="color:var(--bad)">✗ ${esc(e.p)}</span> · <span style="color:var(--ok)">✓ ${esc(e.a)}</span></div></div>`).join("")||'<p class="mut" style="margin:0">Nada por acá.</p>'}</div>
 <button class="btn ghost" data-e="clr">${ERR?"Tocá otra vez para borrar todos los errores":"Borrar registro de errores"}</button>`;
 V.innerHTML=h}
function erCopy(all){ERT=erTxt(all);const done=()=>{if(!all){E1.exp=Date.now();SVE()}};try{navigator.clipboard.writeText(ERT).then(()=>{done();ERT="";erOpen();const b=V.querySelector('[data-e="'+(all?"cpa":"cp")+'"]');if(b)b.textContent="Copiado ✓"},()=>{done();erOpen()})}catch(e){done();erOpen()}}
V.addEventListener("click",ev=>{if(TAB!=5)return;const b=ev.target.closest("[data-e]");if(!b)return;const a=b.dataset.e;
 if(a=="cp")erCopy(0);else if(a=="cpa")erCopy(1);else if(a=="w"){ERW=b.dataset.v;erOpen()}
 else if(a=="dl"){const u=URL.createObjectURL(new Blob([erTxt(1)],{type:"text/plain"})),l=document.createElement("a");l.href=u;l.download="errores-"+TD()+".txt";l.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
 else if(a=="clr"){if(ERR){E1={log:[],st:{},exp:0};SVE();ERR=0}else ERR=1;erOpen()}});
[0,1,2,3,4,5].forEach(i=>$("t"+i).onclick=()=>tab(i));
tab({repaso:0,prog4:1,logica:2,musica:4,errores:5}[location.hash.slice(1)]||0);
</script>
</html>
