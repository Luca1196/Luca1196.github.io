<!--
=====================================================================
INSTRUCTIVO PARA SEGUIR TRABAJANDO (leer esto en vez de analizar todo el codigo)
=====================================================================
QUE ES: app de un solo archivo para que Luca (UdelaR, Programacion 4) aprenda diagramas de comunicacion.
Tres pestanas: Reglas (teoria), Quiz (preguntas con dominio guardado), Practicar (armar el diagrama linea a linea).
PREFERENCIAS DE LUCA: todo en espanol; gastar los menos tokens posibles; nada de vistas previas ni rediseños;
piezas minimas tipo Duolingo (que tenga que acordarse del *, del :=, de la clase); toda la teoria accesible desde los errores;
el diagrama se dibuja mientras arma la respuesta; al fallar se muestra la correcta con las diferencias en rojo.

PUBLICACION: archivo /mnt/user-data/outputs/prog4-comunicacion.html, artefacto https://claude.ai/artifact/BEVPXgEBwZJgRh26mrWwaa
Para cambiar algo: publicar con url + file_path + edits (pares old_str/new_str). Para traerlo: action read con esa url.
Lo nuevo se inserta ANTES de la ultima linea del script: [0,1,2].forEach(i=>$("t"+i).onclick=...);tab(0);

MAPA DEL CODIGO ACTIVO (todo dentro de un unico script):
  R      reglas: [[titulo, html], ...]
  Q      quiz: [pregunta, [correcta, distractores...], explicacion]. La correcta va PRIMERA (se mezcla al mostrar). Agregar solo al final
         (el dominio se guarda por indice en localStorage "lv").
  E      ejercicios de Practicar (ver abajo). HT: pistas, HT[i][k] = pista del paso k del ejercicio i. CL: texto de clases por defecto.
  parse  lee lineas "num: origen -> destino  mensaje  <<estereotipo>>" y devuelve {L, err}. key(): identidad de un objeto (nombre o :Clase).
  pal    arma la paleta de piezas a partir de la solucion; agrega distractores fijos (clase Sistema, ops setEstado/getBeneficio, condicion [hay]).
         Si el dominio nuevo lo pide, agregar distractores propios ahi.
  vf     verifica el paso actual contra la linea exacta de la solucion y devuelve textos de error.
  TH     teoria desplegable de cada error: [[fragmentos], titulo, html]. Un fragmento debe estar contenido en el texto del error que emite vf.
         Si agregas un error nuevo en vf, agrega su entrada en TH (los especificos antes que los genericos).
  cmp    muestra tu linea y la correcta con diferencias en rojo (tk2 tokeniza el mensaje, lcs compara).
  dg     dibuja el SVG (columnas por profundidad desde :Controlador, flecha de entrada con E[ex].sig, flecha punteada = linea en armado, drf()).
  build3/draw3  interfaz de Practicar. Progreso en localStorage "pg2" (cantidad de pasos hechos por indice de ejercicio).
  CODIGO VIEJO (sin uso, se puede borrar): prac, build, draw, ctx, bank, build2, draw2, check, P, OB, MS, KP, S0, S, LN, ln, FMT, pi, ok, lineOf NO (se usa).

COMO AGREGAR UN EJERCICIO DESDE UN PDF (letra + diagrama de clases + solucion):
 1) Del PDF sacar solo tres cosas: enunciado de la operacion; diagrama de clases (clases, asociaciones con multiplicidad, operaciones con parametros);
    diagrama de comunicacion de la solucion (cada flecha). Ignorar el resto.
 2) Escribir la solucion como texto, una linea por flecha, en el orden de ejecucion:
      NUM[*]: ORIGEN -> DESTINO  MENSAJE  <<estereotipo>>
    - NUM anidado (3, 3.1, 3.1.1); un * pegado al NUM si esta dentro de un recorrido (4.1*:).
    - DESTINO multiobjeto: ":Clase *". Primera aparicion de un objeto: "nombre:Clase"; despues solo "nombre". Anonimo: ":Clase".
    - Los mensajes de primer nivel salen de :Controlador. Un N.k sale del receptor del N. El padre debe existir y los hijos ser consecutivos.
    - MENSAJE: "var := op(a, b)" si devuelve algo; "[cond] op(...)" si es condicional. Los parametros separados por ", ". Sin espacios en nombres.
    - Estereotipo: association | local | parameter | global.
    - find/next/add van a multiobjetos; create va al objeto nuevo (p := create(est, opc)).
 3) Agregar al final del arreglo E un objeto: {t:"nombre corto", en:"enunciado", sig:"op(ci, rut)", cl:"texto de clases y operaciones", exp:[], sol:`lineas`}.
    No reordenar los E existentes (el progreso guardado usa el indice). El campo cl reemplaza a CL para ese ejercicio.
 4) Agregar en HT un arreglo con una pista por linea de sol, en el mismo orden (objetivo del paso, sin revelar la respuesta).
 5) Revisar mentalmente que cada linea de sol pase parse() (formato) y que pal() ofrezca las piezas necesarias; ajustar distractores si hace falta.
 6) Publicar con edits. No hace falta tocar nada mas: botones, paleta, verificador y diagrama salen de E.
OTROS: el parcial Programacion 4 de 2026 trae Problema 1 (clases y secuencia del sistema), Problema 2 (comunicacion) y Problema 3 (C++); esta app cubre
comunicacion y reglas basicas. LIMITES: el verificador exige la solucion exacta y en el mismo orden; no acepta variantes validas.
ERRORES FRECUENTES: rec() guarda en localStorage "er" un conteo por TIPO de error (titulo de la entrada de TH), no por ejercicio.
La pestana Mis errores (errs) los lista ordenados por frecuencia con su teoria y un boton Lo supere. vf2 envuelve a vf para detectar clases
escritas sin dos puntos (Controlador en vez de :Controlador). TH.unshift agrega esa entrada primero porque TH.find devuelve la primera coincidencia.
Al sumar un tipo de error nuevo: emitirlo en vf o vf2 y agregar su entrada en TH antes de las genericas.

<script>
const R=[
["1. El mensaje inicial","La operación del sistema (la del diagrama de secuencia) llega al <code>:Controlador</code>, no a «Sistema». Desde ahí se delega al resto. <span class='mut'>Parcial: arrancaste en Sistema.</span>"],
["2. Navegación: ¿cómo conoce el emisor al receptor?","Todo mensaje necesita un camino. Estereotipos: <code>&lt;&lt;association&gt;&gt;</code> hay asociación en el diagrama de clases; <code>&lt;&lt;local&gt;&gt;</code> el objeto está en una variable local (resultado de find, create o un retorno); <code>&lt;&lt;parameter&gt;&gt;</code> llegó como parámetro; <code>&lt;&lt;global&gt;&gt;</code> es global. Si no hay camino, falta navegabilidad: se llega por otro objeto. <span class='mut'>Parcial: buscaste la oferta con find desde Sistema, saltando la Empresa.</span>"],
["3. Objeto vs multiobjeto","Un multiobjeto (<code>:Clase *</code>) es una colección, y el <code>*</code> es el recuadro doble del dibujo a mano escrito en texto: se le envía <code>find</code>, <code>add</code> o <code>next</code>. Un objeto simple (<code>est:Estudiante</code>) recibe operaciones de la clase. Un objeto sin nombre usa <code>:Clase</code>."],
["4. Numeración","Lo que se dispara por un mensaje se anida: <code>3</code> → <code>3.1</code> → <code>3.1.1</code>. El mensaje <code>N.k</code> lo envía el objeto que recibió <code>N</code>. Mismo nivel = orden de ejecución, sin saltos."],
["5. Crear objetos","<code>p := create(est, opc)</code> con <code>&lt;&lt;local&gt;&gt;</code>. Se crea después de tener lo que necesita (est y opc), y el objeto nuevo queda enlazado. <span class='mut'>Parcial: creaste la Postulación antes de buscar al estudiante y a la oferta.</span>"],
["6. Condición e iteración","Condición: <code>4: [cd] aceptarPostulacion(codOferta)</code>. Iteración: asterisco en la numeración y <code>next()</code> sobre el multiobjeto: <code>4.1*: est -&gt; :Postulacion * pe := next()</code>. Condición dentro de la iteración: <code>4.3*: [cod == codOferta] ...</code>."],
["7. Responsabilidad","Cada objeto modifica su propio estado: la Postulacion ejecuta <code>aceptarPostulacion()</code> (cambia estado y guarda beneficio); el Controlador no hace setX de objetos ajenos. <span class='mut'>Parcial: setEstado(aceptada) iba a la Oferta.</span>"],
["8. Polimorfismo","Una operación abstracta se envía a la clase abstracta (<code>:OfertaPasantia</code>) y las implementaciones (Remunerada, NoRemunerada) se muestran en diagramas separados, uno por subclase."],
["9. Coherencia con el diagrama de clases","La operación debe existir en la clase receptora, con sus parámetros, y la asociación debe ser navegable en esa dirección. Antes de dibujar un mensaje, revisá el diagrama de clases."],
["10. Diagrama de secuencia del sistema","Actor → <code>:Sistema</code>; <code>loop</code> para repetir, <code>alt</code> para alternativas. Las operaciones devuelven DataTypes (<code>Set(DTTren)</code>). Notas: el sistema «recuerda» datos entre operaciones; confirmar da de alta y libera memoria, cancelar solo libera."]
];
const Q=[
["¿A quién llega la operación del sistema (ej. postularse)?",[":Controlador","Sistema",":Estudiante","El actor"],"El Controlador recibe la operación y delega. En el parcial arrancaste desde «Sistema»."],
["El Controlador quiere la Empresa por su rut. ¿Qué mensaje y estereotipo?",["find(rut) a :Empresa * con <<association>>","obtenerEmpresa(rut) a Sistema con <<local>>","find(rut) a emp con <<local>>","create(rut) a :Empresa con <<association>>"],"find va al multiobjeto (la colección), y el Controlador llega a ella por asociación."],
["cd := cuposDisponibles(codOferta), enviado del Controlador a emp (ya obtenida con find). ¿Estereotipo?",["<<local>>","<<association>>","<<parameter>>","<<global>>"],"emp quedó en una variable local del Controlador."],
["est ejecuta generarPostulacion(opc) y luego envía agregarPostulacion(p) a opc. ¿Estereotipo de ese envío?",["<<parameter>>","<<local>>","<<association>>","<<global>>"],"opc llegó como parámetro de generarPostulacion."],
["Al mensaje 3 (a emp) le sigue un find de emp a :OfertaPasantia *. ¿Numeración?",["3.1","4","3.0","1.3"],"Lo disparado por un mensaje se anida: 3 → 3.1."],
["En postularse, ¿cuándo se crea la Postulacion?",["Después de obtener est y opc, porque create(est, opc) los necesita","Primero de todo, y después se buscan","Al final, desde Sistema","Cuando la empresa lo pide"],"El create necesita a ambos como parámetros. En el parcial lo hiciste primero."],
["¿Cómo se recorren todas las postulaciones de un estudiante?",["Numeración con * y next() sobre :Postulacion *","find(todas) a una Postulacion","getPostulaciones() a Sistema","Numerando 4.1, 4.2, 4.3"],"Iteración: 4.1*: next() sobre el multiobjeto."],
["En aceptarPostulacion, ¿quién cambia el estado a «aceptada» y guarda el beneficio?",["La propia Postulacion","OfertaPasantia con setEstado","El Controlador con setBeneficio","La Empresa"],"Cada objeto modifica su propio estado. En el parcial setEstado iba a la Oferta."],
["calcularBeneficio() es abstracta en OfertaPasantia. En el diagrama de comunicación…",["Se envía a :OfertaPasantia y se dibuja un diagrama por subclase","Se dibuja solo Remunerada","Se envía directo a Capacitacion","Se resuelve con un if en el Controlador"],"Polimorfismo: el mensaje va a la clase abstracta y cada implementación se muestra aparte."],
["El Controlador necesita un objeto al que no llega por asociación, ni es local ni parámetro. ¿Qué indica?",["Falta navegabilidad: hay que llegar por otro objeto","Se usa <<global>> igual","Se dibuja sin estereotipo","Se manda a Sistema"],"Todo emisor debe poder navegar hasta el receptor. Revisá el diagrama de clases primero."],
["¿Cómo se marca que un mensaje solo ocurre si cd es verdadero?",["Condición entre corchetes: 4: [cd] aceptarPostulacion(...)","Con * en el número","Con <<local>>","No se puede"],"La condición va entre corchetes antes del mensaje."]
];
const M={Controlador:[],Estudiante:["generarPostulacion","aceptarPostulacion"],Empresa:["obtenerOferta","cuposDisponibles"],OfertaPasantia:["agregarPostulacion","hayCupos","calcularBeneficio"],Postulacion:["getOfertaPasantiaCodigo","aceptarPostulacion","getEstado"]};
const CL="Controlador -> Estudiante *, Empresa *\nEmpresa -> OfertaPasantia *\nEstudiante <-> Postulacion *\nPostulacion <-> OfertaPasantia (1)\nOfertaPasantia (abstracta): Remunerada, NoRemunerada\n\nOperaciones:\nEstudiante: generarPostulacion(opc), aceptarPostulacion(cod)\nEmpresa: obtenerOferta(cod), cuposDisponibles(cod)\nOfertaPasantia: agregarPostulacion(p), hayCupos(), calcularBeneficio()\nPostulacion: getOfertaPasantiaCodigo(), aceptarPostulacion(), getEstado()";
const E=[
{t:"postularse",en:"postularse(ci, rut, codOferta): el estudiante se postula a una oferta de una empresa. Se crea una Postulacion pendiente enlazada al estudiante y a la oferta.",
exp:[["Estudiante.find","association"],["Empresa.find","association"],["Empresa.obtenerOferta","local"],["OfertaPasantia.find","association"],["Estudiante.generarPostulacion","local"],["Postulacion.create","local"],["OfertaPasantia.agregarPostulacion","parameter"],["Postulacion.add","association"]],
sol:`1:     :Controlador -> :Estudiante *    est := find(ci)                   <<association>>
2:     :Controlador -> :Empresa *       emp := find(rut)                  <<association>>
3:     :Controlador -> emp:Empresa      opc := obtenerOferta(codOferta)   <<local>>
3.1:   emp -> :OfertaPasantia *         op := find(codOferta)             <<association>>
4:     :Controlador -> est:Estudiante   generarPostulacion(opc)           <<local>>
4.1:   est -> p:Postulacion              p := create(est, opc)             <<local>>
4.2:   est -> opc:OfertaPasantia         agregarPostulacion(p)             <<parameter>>
4.2.1: opc -> :Postulacion *             add(p)                            <<association>>
4.3:   est -> :Postulacion *             add(p)                            <<association>>`},
{t:"aceptarPostulacion",en:"aceptarPostulacion(ci, rut, codOferta): solo si la oferta tiene cupos, el estudiante acepta su postulación a esa oferta. Se cambia el estado y se guarda el beneficio, calculado según el tipo de oferta.",
exp:[["Estudiante.find","association"],["Empresa.find","association"],["Empresa.cuposDisponibles","local"],["OfertaPasantia.find","association"],["OfertaPasantia.hayCupos","local"],["Estudiante.aceptarPostulacion","local"],["Postulacion.next","association"],["Postulacion.getOfertaPasantiaCodigo","local"],["Postulacion.aceptarPostulacion","local"],["OfertaPasantia.calcularBeneficio","association"]],
sol:`1:      :Controlador -> :Estudiante *   est := find(ci)                      <<association>>
2:      :Controlador -> :Empresa *      emp := find(rut)                     <<association>>
3:      :Controlador -> emp:Empresa     cd := cuposDisponibles(codOferta)    <<local>>
3.1:    emp -> :OfertaPasantia *        opc := find(codOferta)               <<association>>
3.2:    emp -> opc:OfertaPasantia       hay := hayCupos()                    <<local>>
3.2.1*: opc -> :Postulacion *           p := next()                          <<association>>
3.2.2*: opc -> p:Postulacion            e := getEstado()                     <<local>>
4:      :Controlador -> est:Estudiante  [cd] aceptarPostulacion(codOferta)   <<local>>
4.1*:   est -> :Postulacion *           pe := next()                         <<association>>
4.2*:   est -> pe:Postulacion           cod := getOfertaPasantiaCodigo()     <<local>>
4.3*:   est -> pec:Postulacion          [cod == codOferta] aceptarPostulacion()  <<local>>
4.3.1:  pec -> :OfertaPasantia          b := calcularBeneficio()             <<association>>`}
];
const FMT="# formato: num: origen -> destino  mensaje  <<estereotipo>>\n# multiobjeto: :Clase *   iteración: 4.1*:   condición: [cond]\n";
const $=id=>document.getElementById(id),v=$("v");
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const sv=(k,x)=>{try{localStorage.setItem(k,JSON.stringify(x))}catch(e){}};
function tab(i){[0,1,2,3].forEach(j=>$("t"+j).className=j==i?"on":"");[rules,quiz,build3,errs][i]()}
function rules(){v.innerHTML=R.map(r=>`<div class="card"><h3>${r[0]}</h3>${r[1]}</div>`).join("")}
let lv=ld("lv",{}),cur;
function quiz(){const done=Q.filter((_,i)=>(lv[i]||0)>=2).length;
const w=Q.map((_,i)=>1/(1+(lv[i]||0)*2)),s=w.reduce((a,b)=>a+b);let r=Math.random()*s,i=0;while(r>w[i]){r-=w[i];i++}
if(i==cur&&Q.length>1)i=(i+1)%Q.length;cur=i;const q=Q[i];
const o=q[1].map((t,k)=>[t,k]).sort(()=>Math.random()-.5);
v.innerHTML=`<p class="mut">Dominadas: ${done}/${Q.length} (2 aciertos seguidos). Las que fallás aparecen más.</p><div class="card"><h3>${q[0]}</h3>${o.map(([t,k])=>`<button class="opt" data-k="${k}">${t.replace(/</g,"&lt;")}</button>`).join("")}<div id="fb"></div></div>`;
v.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const k=+b.dataset.k,okk=k==0;
v.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(x.dataset.k==0)x.classList.add("ok")});if(!okk)b.classList.add("no");
lv[i]=okk?(lv[i]||0)+1:0;sv("lv",lv);
$("fb").innerHTML=`<p class="${okk?"ok":"bad"}"><b>${okk?"Correcto.":"No."}</b> ${q[2]}</p><button id="nx">Siguiente</button>`;$("nx").onclick=quiz})}
let ex=0;
function prac(){const e=E[ex];
v.innerHTML=`<div class="row">${E.map((x,i)=>`<button class="${i==ex?"on":""}" data-i="${i}">${x.t}</button>`).join("")}</div>
<div class="card"><p>${e.en}</p><pre>${CL}</pre><p class="mut">Hacelo primero en papel, después pasalo acá.</p>
<textarea id="ta" spellcheck="false">${FMT}</textarea>
<div class="row"><button id="vd" class="on">Validar</button><button id="sl">Ver solución</button></div><div id="out"></div></div>`;
v.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{ex=+b.dataset.i;prac()});
$("vd").onclick=()=>{const p=parse($("ta").value),r=p.err.concat(p.L.length?check(p.L,e):["No hay mensajes."]);
$("out").innerHTML=r.length?r.map(x=>`<div class="err">• ${x.replace(/</g,"&lt;")}</div>`).join(""):`<div class="good">Sin errores. Compará igual con la solución.</div>`};
$("sl").onclick=()=>{const p=document.createElement("pre");p.textContent=e.sol;$("out").innerHTML="";$("out").appendChild(p)}}
function parse(t){const L=[],err=[];t.split("\n").forEach((raw,i)=>{const s=raw.trim();if(!s||s[0]=="#")return;
const p=s.split("->");if(p.length!=2){err.push(`Línea ${i+1}: falta "->" (origen -> destino).`);return}
const l=p[0].match(/^(\d+(?:\.\d+)*)(\*)?:\s*(\S+)\s*$/),r=p[1].trim().match(/^(\S+)\s+(\*\s+)?(.+?)\s*<<(\w+)>>\s*$/);
if(!l||!r){err.push(`Línea ${i+1}: formato inválido. Ej: 1: :Controlador -> :Estudiante *  est := find(ci)  <<association>>`);return}
let d=r[1],m=!!r[2]||d.endsWith("*");d=d.replace(/\*$/,"");
L.push({n:l[1],it:!!l[2],o:l[3],d,m,msg:r[3],st:r[4]})});return{L,err}}
const key=t=>{const[a,b]=t.split(":");return b===undefined?a:(a||":"+b)};
function check(L,e){const out=[],C={},N=new Map(),ST=["association","local","parameter","global"],G=["find","add","next"];
const cl=t=>{if(t.includes(":")){const[a,b]=t.split(":");if(a)C[a]=b;return b}return C[t]};

const TH=[
[["iteración"],"Iteración (*)","<p>Un <code>*</code> pegado al número indica que el mensaje se repite: se está recorriendo una colección. Aparece en el <code>next()</code> sobre el multiobjeto y en todos los mensajes que se ejecutan <i>dentro</i> del recorrido (4.1*, 4.2*, 4.3*).</p><p>Si el mensaje ocurre una sola vez, no lleva <code>*</code>. Preguntate: ¿esto pasa una vez, o una vez por cada elemento de la colección?</p>"],
[["numeración"],"Numeración","<p>La numeración sigue la anidación de las llamadas. Lo que el Controlador envía directamente es 1, 2, 3… en orden. Cuando el receptor del mensaje <code>N</code> envía otros mensajes para resolverlo, esos son <code>N.1</code>, <code>N.2</code>… y así sucesivamente.</p><p>Para numerar, preguntate qué objeto está ejecutando este mensaje. Si es el Controlador, es de primer nivel. Si es el receptor del 3, es <code>3.x</code>. Ej: el Controlador le pide la oferta a emp (<code>3</code>); emp la busca en su colección (<code>3.1</code>).</p>"],
[["nombre no coincide"],"Objeto con nombre o anónimo","<p><code>:Clase</code> es un objeto anónimo y <code>nombre:Clase</code> uno con nombre. Si después vas a enviarle mensajes o pasarlo como parámetro, necesita nombre, porque con ese nombre lo vas a referenciar.</p><p>Ej: <code>est:Estudiante</code> se usa después como origen de <code>create</code> y como parámetro. Si lo dejás anónimo, el resto del diagrama no tiene cómo nombrarlo.</p>"],
[["multiobjeto (*)"],"Multiobjeto","<p>Un multiobjeto (<code>:Clase *</code>) representa una colección de instancias y es la versión en texto del recuadro doble (rectángulos apilados) que se dibuja a mano: el <code>*</code> ocupa el lugar del segundo recuadro. Se usa cuando el mensaje opera sobre el conjunto: <code>find</code> (buscar uno por clave), <code>next</code> (recorrer) y <code>add</code> (agregar).</p><p>Si el destino es una colección y no lo marcás con <code>*</code>, estás diciendo que es un único objeto concreto, y un objeto concreto no tiene <code>find</code>. En el diagrama de clases suele corresponder a una multiplicidad <code>*</code> o a «todas las instancias de la clase».</p><p>No lo confundas con el <code>*</code> pegado al número (<code>4.1*:</code>): ese indica iteración y es otro símbolo, con otro significado.</p>"],
[["sobra el *"],"Objeto simple","<p>El <code>*</code> se reserva para colecciones. Si el mensaje es una operación propia de la clase (<code>hayCupos()</code>, <code>getEstado()</code>, <code>generarPostulacion(opc)</code>…), va a un objeto concreto que ya obtuviste (est, emp, opc…), no a la colección.</p>"],
[["primera aparición"],"Primera aparición de un objeto","<p>La primera vez que un objeto aparece en el diagrama se declara con su clase: <code>nombre:Clase</code> (ej. <code>emp:Empresa</code>). Así el diagrama deja claro de qué clase es. Después alcanza con el nombre (<code>emp</code>).</p><p>Ojo: obtener un objeto con <code>emp := find(rut)</code> crea la variable, pero el objeto recién «aparece» en el diagrama cuando es origen o destino de un mensaje.</p>"],
[["Falta el destino","no es el objeto que recibe"],"Destino del mensaje","<p>El destino es el objeto que recibe el mensaje y lo ejecuta, así que debe tener esa operación en el diagrama de clases (o ser un multiobjeto, para find/add/next). Elegí el destino pensando en quién tiene la información: quien sabe algo es quien lo responde.</p><p>Además, el emisor tiene que poder llegar a ese objeto: por asociación, porque es local o porque le llegó como parámetro.</p>"],
[["Falta el origen","Origen:"],"Origen del mensaje","<p>El origen es el objeto que está ejecutando el código que envía el mensaje. Los mensajes de primer nivel salen siempre del <code>:Controlador</code>, que recibe la operación del sistema (no existe una caja «Sistema»). Un mensaje <code>N.k</code> sale del objeto que recibió el <code>N</code>.</p>"],
[["Falta el mensaje"],"Mensaje","<p>Cada flecha lleva el mensaje con la forma <code>operación(parámetros)</code>, y <code>variable := operación(...)</code> si devuelve algo que se usa después.</p>"],
[["condición"],"Condición","<p>Una condición entre corchetes antes del mensaje indica que solo se envía si es verdadera. Ej: <code>[cd] aceptarPostulacion(codOferta)</code> solo ocurre si <code>cd</code> es verdadero. También puede ir dentro de un recorrido: <code>[cod == codOferta]</code>, que filtra por cada elemento.</p><p>Si el mensaje se envía siempre, no lleva condición.</p>"],
[["resultado","variable de retorno"],"Resultado (:=)","<p>Si la operación devuelve algo que vas a usar después, se guarda en una variable: <code>est := find(ci)</code>. Ese nombre es el que usás luego como objeto o como parámetro.</p><p>Las operaciones que solo hacen algo (<code>add</code>, <code>agregarPostulacion</code>, <code>generarPostulacion</code>) no guardan resultado: no llevan <code>:=</code>.</p>"],
[["la operación"],"Operación","<p>La operación debe existir en la clase del destino (mirá el diagrama de clases) y ser la que cumple lo que le estás pidiendo. <code>find</code>, <code>next</code> y <code>add</code> son para multiobjetos y <code>create</code> para crear objetos; el resto son operaciones propias de cada clase.</p>"],
[["parámetros"],"Parámetros","<p>Los parámetros son lo que el receptor necesita para ejecutar la operación. Tienen que estar disponibles en el emisor: ser parámetros de la operación del sistema (ci, rut, codOferta) o variables que ya obtuviste (est, opc, p…).</p>"],
[["Estereotipo","estereotipo"],"Estereotipo","<p>El estereotipo dice <b>cómo conoce el emisor al receptor</b>. Preguntate: ¿de dónde saca el emisor a este objeto?</p><p><code>&lt;&lt;association&gt;&gt;</code>: hay una asociación navegable en el diagrama de clases. Ej: el Controlador accede a la colección <code>:Estudiante *</code> para el find.</p><p><code>&lt;&lt;local&gt;&gt;</code>: el receptor es una variable local del emisor (resultado de un find, create o recorrido). Ej: el Controlador ya hizo <code>est := find(ci)</code> y después le envía un mensaje a est.</p><p><code>&lt;&lt;parameter&gt;&gt;</code>: el receptor llegó como parámetro de la operación que se está ejecutando. Ej: est ejecuta <code>generarPostulacion(opc)</code> y le envía un mensaje a opc.</p><p><code>&lt;&lt;global&gt;&gt;</code>: el objeto es accesible globalmente (poco frecuente).</p>"]];
