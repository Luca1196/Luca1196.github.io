<!--
INSTRUCTIVO PARA SEGUIR TRABAJANDO (leer esto en vez de analizar todo el codigo)
QUE ES: app de un solo archivo para que Luca (Logica) practique deduccion natural, copiando la dinamica de la app de Prog4.
Pestanas: Reglas, Quiz (dominio "lvn"), Practicar, Mis errores ("ern": conteo por "tipo · regla").
PREFERENCIAS: todo en espanol; gastar pocos tokens; nada de vistas previas ni redisenos; piezas minimas.
PRACTICAR TIENE DOS FASES por ejercicio:
 1) BORRADOR (como se resuelve de verdad): estado = metas abiertas, cada una con su contexto de hipotesis. Luca elige movimientos en cualquier orden:
    hacia atras sobre la meta (I∧ I→ I¬ I∨ I↔ I∀ I∃ RAA E⊥ E¬b E→b) y hacia adelante sobre una hipotesis (E∧ E→f E¬f E∨ E∀ E∃; E∨ y E∃ parten la meta).
    mv() valida que la regla sea LEGAL (forma, premisas presentes, condiciones laterales con fv/ff/sb); NO compara con una solucion: acepta cualquier derivacion correcta.
    En proposicional avisa "camino sin salida" (entails: tabla de verdad) cuando una submeta ya no se sigue del contexto. Boton Pista = receta (hint). Deshacer = pila de structuredClone.
    Una meta se cierra sola si ya esta en el contexto (cl0/sol/up). build() arma el nodo de cada meta cuando todas sus submetas estan hechas.
 2) EN LIMPIO: del borrador se arma el arbol (cl, fx, idx) y se rehace nodo por nodo: regla, premisa, que cancela, etiqueta, condicion (cor/vf/cmp/dt). Aca si se compara con ese arbol.
CODIGO: pf parsea formulas (cuantificador = prefijo como ¬; ∧ > ∨ > → > ↔), pr imprime, fv/sb/ff = variables libres, sustitucion, "libre para". RT reglas, TT teoria por tipo de error, Q quiz (correcta PRIMERA; agregar solo al final).
EJERCICIOS: E = {t,en,P:[premisas],g:"meta"} (formulas como texto). Agregar al final de E. Sin E↔ (no se usa).
-->

["hip","Hipótesis y etiquetas",`<p>Una hipótesis cancelada se escribe <code>[φ]ⁿ</code> y n es la etiqueta de la regla que la cancela, que debe estar más abajo en el árbol y cancelar exactamente esa fórmula. Una fórmula que es premisa del juicio (Γ) queda sin corchetes ni etiqueta. Cada etiqueta se usa una sola vez por regla.</p>`]];
const R=[["Cómo encarar una derivación",`<p>Se trabaja en las dos direcciones: hacia atrás desde la conclusión y hacia adelante desde las premisas, y recién al final se pasa en limpio. Receta: 1) Si la meta ya está entre tus hipótesis, cerrala. 2) Mirá el conector de la meta: ∧ → ¬ ↔ ∀ se desarman sin perder nada con su introducción. 3) Desarmá lo que tenés: E∧, E∃, E∀ con términos del problema, E→ si tenés el antecedente, E∨ en casos. 4) Si seguís trabado: RAA. 5) ⊥ se logra con E¬ (φ y ¬φ). 6) Pasá en limpio y revisá cancelaciones y condiciones (∗). <span class="mut">I∨ e I∃ son elecciones: solo si ya sabés qué lado o testigo vale.</span></p><p class="mut">Versión corta: 1) Mirá el conector principal de la conclusión: si podés construirla, usá su <b>introducción</b>. 2) Si sale de una premisa o hipótesis, usá <b>eliminaciones</b>. 3) Si te trabás: <b>RAA</b> (suponé ¬conclusión y buscá ⊥). 4) ⊥ se logra con <b>E¬</b> (φ y ¬φ). 5) Al final revisá que toda hipótesis abierta esté en Γ y que escribiste las condiciones (∗). <span class="mut">En el examen no se aceptan justificaciones semánticas.</span></p>`]].concat(RT.map(r=>[r[1],r[2]]));
const TT={
"regla":"<p>Mirá la fórmula objetivo. Si su conector principal se puede construir, usá la introducción de ese conector. Si sale de una premisa o hipótesis, usá eliminaciones. Si estás trabado, RAA. Si la fórmula ya es una hipótesis o premisa, se cierra como Hipótesis.</p>",
"premisa":"<p>Las eliminaciones y I∃/I∨ piden la premisa exacta: E∧ la conjunción completa, E→ el antecedente, E¬ la fórmula φ (quedan ¬φ y φ), E∨ la disyunción, E∀/E∃/I∃ la fórmula cuantificada o instanciada, I∨ el disyunto que probás. Fijate qué hipótesis tenés a la vista.</p>",
"cancelación":"<p>Cancelan: I→ (el antecedente, o nada), I¬ (φ), RAA (¬φ), E∨ (los dos disyuntos), E∃ (φ(x)). Se cancela la hipótesis que se usó arriba con esa etiqueta.</p>",
"etiqueta":"<p>Cada hipótesis cancelada lleva la etiqueta de la regla que la cancela, y esa regla tiene que estar más abajo (ser ancestro) y cancelar exactamente esa fórmula. Si la fórmula es una premisa del juicio (Γ), no lleva etiqueta.</p>",
"camino sin salida":"<p>Cada movimiento tiene que dejar submetas que todavía se sigan de tus hipótesis. Si una submeta ya no se sigue, ese camino no termina (ej.: I∨ eligiendo el disyunto que no podés probar). Deshacé y probá el otro lado, otra regla o RAA.</p>","condición":"<p>E∀ e I∃: t libre para x en φ. I∀: x ∉ FV de las hipótesis abiertas. E∃: x ∉ FV de ψ ni de las hipótesis abiertas (salvo φ(x)). En el examen hay que escribir cada (∗) explícitamente.</p>"};
const thR=r=>(RT.find(x=>x[0]==r)||[0,0,""])[2];
const Q=[
["Querés probar φ→ψ. ¿Qué regla usás y qué se cancela?",["I→: suponés φ, llegás a ψ y cancelás φ","I→: suponés ψ, llegás a φ y cancelás ψ","E→: tomás φ y ψ como premisas","RAA: suponés ¬ψ y cancelás ¬ψ"],"I→ cancela el antecedente: de la hipótesis φ deducís ψ y queda φ→ψ."],
["Querés probar ¬φ. ¿Qué regla usás?",["I¬: suponés φ, llegás a ⊥ y cancelás φ","RAA: suponés ¬φ, llegás a ⊥ y cancelás ¬φ","E¬ aplicada a φ","E⊥ desde φ"],"I¬ concluye ¬φ cancelando φ. RAA concluye φ cancelando ¬φ: no las confundas."],
["¿Qué premisas necesita E¬ y qué concluye?",["¬φ y φ; concluye ⊥","φ y ψ; concluye φ∧ψ","⊥; concluye cualquier φ","φ→⊥; concluye ¬φ"],"E¬ junta una fórmula y su negación para llegar a ⊥. En el examen: primero ¬φ y después φ."],
["¿Qué hace E⊥?",["De ⊥ concluye cualquier fórmula","De φ y ¬φ concluye ⊥","Cancela ¬φ y concluye φ","De ⊥ concluye ¬φ cancelando φ"],"Ex falso: de una contradicción sale cualquier cosa. Ej. 2c: de ⊥ se concluye (∀x)Q(x)."],
["Ninguna introducción ni eliminación directa te lleva a la conclusión φ. ¿Qué intentás?",["RAA: suponer ¬φ y buscar ⊥","I¬ suponiendo φ","I→ suponiendo ⊥","E⊥ sin tener ⊥"],"RAA es el recurso general: suponés ¬φ, llegás a ⊥ y cancelás ¬φ."],
["En E∨ (de φ∨ψ a σ), ¿qué se cancela?",["φ en una rama y ψ en la otra; ambas ramas llegan a σ","Solo φ∨ψ","Solo ¬σ","Nada"],"Hay dos derivaciones de σ, una bajo φ y otra bajo ψ; las dos hipótesis se cancelan con etiquetas distintas."],
["Para I∨ con conclusión φ∨ψ, ¿qué necesitás?",["Probar φ o probar ψ (alcanza uno)","Probar φ y ψ","Probar ¬φ","Probar φ→ψ"],"I∨ solo pide un disyunto. En 3a hay que elegir el que se puede probar."],
["¿Qué premisas tiene E→ para concluir ψ?",["φ→ψ y φ","φ→ψ y ψ","φ y ψ","¬ψ→¬φ"],"Modus ponens. La decisión clave es el antecedente φ."],
["¿Condición lateral de E∀ (de (∀x)φ(x) a φ(t))?",["t libre para x en φ","x ∉ FV de las hipótesis abiertas","x ∉ FV(ψ) ni de las hipótesis abiertas","Ninguna"],"Al sustituir x por t no se debe capturar ninguna variable de t. Ej. 2c: f(x) libre para x en ¬P(x)."],
["¿Condición lateral de I∃ (de φ(t) a (∃x)φ(x))?",["t libre para x en φ","x ∉ FV de las hipótesis abiertas","x ∉ FV(ψ) ni de las hipótesis abiertas","Ninguna"],"Igual que E∀: t libre para x en φ. Ej. 3b: x libre para x en P(x,x)."],

const SD="α∨(β∧¬γ)",H="¬α→¬(β→γ)",P3="(∀x)(∀y)(∀z)(R(x,y)∧R(x,z)→P(y,z))";
const E=[
{t:"2c",en:"Derivar {ψ, (∀x)¬P(x)} ⊢ (∀x)Q(x), con ψ := (∀x)P(f(x)) ∧ (∃z)¬P(z).",P:["(∀x)P(f(x)) ∧ (∃z)¬P(z)","(∀x)¬P(x)"],g:"(∀x)Q(x)"},
{t:"3b",en:"Derivar (∃x)R(x,x), "+P3+" ⊢ (∃x)P(x,x).",P:["(∃x)R(x,x)",P3],g:"(∃x)P(x,x)"},
{t:"3a ←",en:"Parte de 3a: ⊢ ("+SD+") → ("+H+").",P:[],g:`(${SD})→(${H})`},
{t:"3a →",en:"Parte de 3a: ⊢ ("+H+") → ("+SD+").",P:[],g:`(${H})→(${SD})`},
{t:"3a completo",en:"⊢ ("+H+") ↔ ("+SD+").",P:[],g:`(${H})↔(${SD})`}];
function pf(s){const T=s.match(/[A-Za-z0-9_α-ωΑ-Ω]+|\S/g);let i=0;const nt=()=>T[i++],pk=()=>T[i];
const trm=()=>{const n=nt();if(pk()=="("){i++;const a=[trm()];while(pk()==","){i++;a.push(trm())}i++;return{k:"fn",n,a}}return{k:"v",n}};
const at=()=>{const n=nt(),a=[];if(pk()=="("){i++;a.push(trm());while(pk()==","){i++;a.push(trm())}i++}return{k:"at",n,a}};
const un=()=>{const t=pk();if(t=="¬"){i++;return{k:"not",a:un()}}if(t=="⊥"){i++;return{k:"bot"}}
if(t=="("){if(T[i+1]=="∀"||T[i+1]=="∃"){const q=T[i+1]=="∀"?"all":"ex",v=T[i+2];i+=4;return{k:q,v,a:un()}}i++;const f=iff();i++;return f}return at()};
const bin=(g,op,k)=>()=>{let l=g();while(pk()==op){i++;l={k,l,r:g()}}return l};
const and=bin(un,"∧","and"),or=bin(and,"∨","or"),imp=()=>{const l=or();if(pk()=="→"){i++;return{k:"imp",l,r:imp()}}return l},iff=bin(imp,"↔","iff");return iff()}
const PR={iff:1,imp:2,or:3,and:4},pt=t=>t.k=="v"?t.n:t.n+"("+t.a.map(pt).join(",")+")",u=g=>PR[g.k]?"("+pr(g)+")":pr(g);
function pr(f){switch(f.k){case"bot":return"⊥";case"at":return f.n+(f.a.length?"("+f.a.map(pt).join(",")+")":"");case"not":return"¬"+u(f.a);case"all":return"(∀"+f.v+")"+u(f.a);case"ex":return"(∃"+f.v+")"+u(f.a);
default:{const c=g=>PR[g.k]&&!(g.k=="and"&&(f.k=="imp"||f.k=="iff"))?"("+pr(g)+")":pr(g);return c(f.l)+({iff:"↔",imp:"→",or:"∨",and:"∧"})[f.k]+c(f.r)}}}
const tv=(t,s)=>t.k=="v"?s.add(t.n):t.a.forEach(x=>tv(x,s));
function fv(f,b=[],s=new Set()){switch(f.k){case"at":{const q=new Set();f.a.forEach(t=>tv(t,q));q.forEach(x=>b.includes(x)||s.add(x));break}case"not":fv(f.a,b,s);break;case"all":case"ex":fv(f.a,b.concat(f.v),s);break;case"bot":break;default:fv(f.l,b,s);fv(f.r,b,s)}return s}
const stt=(m,x,t)=>m.k=="v"?(m.n==x?t:m):{k:"fn",n:m.n,a:m.a.map(y=>stt(y,x,t))};
function sb(f,x,t){switch(f.k){case"at":return{...f,a:f.a.map(m=>stt(m,x,t))};case"not":return{k:"not",a:sb(f.a,x,t)};case"all":case"ex":return f.v==x?f:{...f,a:sb(f.a,x,t)};case"bot":return f;default:return{...f,l:sb(f.l,x,t),r:sb(f.r,x,t)}}}
function ff(f,x,t){const V=new Set();tv(t,V);const w=(g,b)=>{switch(g.k){case"at":{const q=new Set();g.a.forEach(m=>tv(m,q));return!(q.has(x)&&!b.includes(x)&&b.some(y=>V.has(y)))}case"not":return w(g.a,b);case"all":case"ex":return w(g.a,b.concat(g.v));case"bot":return true;default:return w(g.l,b)&&w(g.r,b)}};return w(f,[])}
